<div id="container">
  <dx-autocomplete
    [dataSource]="dataSource"
    valueExpr="Subject"
    [grouped]="true"
    label="Search for a task"
    labelMode="floating"
    [showClearButton]="true"
    (onValueChanged)="onValueChanged($event)"
    groupTemplate="group"
    itemTemplate="item"
    [wrapItemText]="true"
    [searchTimeout]="300"
    [maxLength]="20"
  >
    <div *dxTemplate="let data of 'group'">
      <span>Assigned to {{ data.key }}</span>
    </div>
    <div *dxTemplate="let item of 'item'; let index = index">
      <span>{{ index + 1 }}. {{ item.Subject }}</span>
    </div>
  </dx-autocomplete>
</div>
